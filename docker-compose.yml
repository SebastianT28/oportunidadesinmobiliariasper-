version: "3.9"

services:

  # ── Servidor PHP + Apache ──────────────────────────────────────────────────
  php-apache:
    image: php:8.2-apache
    container_name: inmobiliaria_web
    ports:
      - "8080:80"
    volumes:
      - ./Codigo/public_html:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    # Habilita mod_rewrite (necesario para .htaccess) y AllowOverride All
    command: >
      bash -c "a2enmod rewrite &&
               sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
               apache2-foreground"
    depends_on:
      - mysql
    restart: unless-stopped

  # ── MySQL 8.0 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: inmobiliaria_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # ── phpMyAdmin ─────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: inmobiliaria_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
    restart: unless-stopped

# ── Volúmenes persistentes ─────────────────────────────────────────────────
volumes:
  db_data:
